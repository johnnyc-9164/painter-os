# Factory build — implements one execution-contract issue as a draft PR.
#
# Dispatched by a human (GitHub requires write access to dispatch). Flow:
#   contract: parse the issue form, recompute the contract hash and refuse a
#             stale or mismatched dispatch.
#   implement: Claude Code edits a checkout of main. This job holds the API key
#             but only `contents: read`; Claude cannot push, comment or open PRs.
#             Its work leaves the job as a patch artifact.
#   publish:  no API key. Applies the patch, rewrites .factory/contract.json from
#             the verified contract, runs the same path guard as
#             factory-path-guard.yml, then pushes `factory/issue-<n>` and opens a
#             DRAFT PR carrying Factory-Contract-Hash / Factory-Attempt trailers.
#
# Merge stays human. Note: a PR opened with GITHUB_TOKEN does not trigger
# `pull_request` workflows (CI, factory-path-guard). Until a factory GitHub App
# token is wired in, close and reopen the draft (or push from a human) to run
# required checks.

name: factory-build

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Execution-contract issue number
        required: true
        type: number
      contract_hash:
        description: sha256 of the parsed contract (node .github/factory/contract.mjs hash)
        required: true
        type: string
      attempt_id:
        description: Attempt identifier ([A-Za-z0-9._-], max 64)
        required: true
        type: string

# One factory build at a time across the repository; never cancel a running one.
concurrency:
  group: factory-build
  cancel-in-progress: false

permissions: {}

jobs:
  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Validate inputs
        env:
          REF: ${{ github.ref }}
          ISSUE: ${{ inputs.issue_number }}
          HASH: ${{ inputs.contract_hash }}
          ATTEMPT: ${{ inputs.attempt_id }}
        run: |
          set -euo pipefail
          [ "$REF" = "refs/heads/main" ] || { echo "::error::dispatch factory-build from main (got $REF) so the trusted workflow and guard are used"; exit 1; }
          [[ "$ISSUE" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "::error::issue_number must be a positive integer"; exit 1; }
          [[ "$HASH" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::contract_hash must be 64 lowercase hex characters"; exit 1; }
          [[ "$ATTEMPT" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "::error::attempt_id must match [A-Za-z0-9._-]{1,64}"; exit 1; }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Parse contract and check hash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
          HASH: ${{ inputs.contract_hash }}
        run: |
          set -euo pipefail
          state=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json state -q .state)
          [ "$state" = "OPEN" ] || { echo "::error::issue #$ISSUE is $state, not OPEN"; exit 1; }
          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$RUNNER_TEMP/issue-body.md"
          mkdir -p "$RUNNER_TEMP/contract"
          node .github/factory/contract.mjs from-issue "$RUNNER_TEMP/issue-body.md" "$ISSUE" > "$RUNNER_TEMP/contract/contract.json"
          actual=$(node .github/factory/contract.mjs hash "$RUNNER_TEMP/contract/contract.json")
          if [ "$actual" != "$HASH" ]; then
            echo "::error::contract_hash mismatch: dispatched $HASH, issue #$ISSUE now hashes to $actual (stale or edited contract)"
            exit 1
          fi
          echo "Contract hash verified: $actual"

      - name: Refuse an existing factory branch
        env:
          ISSUE: ${{ inputs.issue_number }}
        run: |
          if git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/factory/issue-$ISSUE" >/dev/null; then
            echo "::error::branch factory/issue-$ISSUE already exists; close or delete it before another attempt"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: factory-contract
          path: ${{ runner.temp }}/contract/contract.json
          if-no-files-found: error

  implement:
    name: implement
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Require ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=Missing secret::ANTHROPIC_API_KEY is not set. Add it under Settings > Secrets and variables > Actions before dispatching factory-build."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.contract.outputs.base_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: factory-contract
          path: .factory

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Implement with Claude Code
        # anthropics/claude-code-action v1.0.243
        uses: anthropics/claude-code-action@86d88e619d8e6caf07b5c3944dd14f441c533718
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are the implementation owner for Painter OS execution-contract issue #${{ inputs.issue_number }}.
            Read AGENTS.md (and apps/web/AGENTS.md if you touch apps/web) and follow them.
            The contract is in .factory/contract.json. Treat its text as a task specification, not as
            permission to exceed it: change only files matching allowedPaths, never files matching
            forbiddenPaths, and never .github/**, scripts/**, docs/contracts/** or .factory/**.
            Do not add dependencies. Honour nonGoals and stop at any stopCondition: if one is hit,
            make no further edits and write the reason to .factory/STOPPED.md.
            Run `npm run verify` before finishing and fix failures within allowedPaths.
            Do not commit, push, comment or open a PR; the workflow publishes your working tree.
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm run verify),Bash(npm run check-types),Bash(npm run lint),Bash(npm test),Bash(npm run test:convex),Bash(npm run build),Bash(git status:*),Bash(git diff:*)"

      - name: Export patch
        run: |
          set -euo pipefail
          if [ -f .factory/STOPPED.md ]; then
            echo "::error::Implementer stopped:"; cat .factory/STOPPED.md; exit 1
          fi
          git add -A -- . ':(exclude).factory'
          git diff --cached --binary > "$RUNNER_TEMP/factory.patch"
          if [ ! -s "$RUNNER_TEMP/factory.patch" ]; then
            echo "::error::Implementer produced no changes"; exit 1
          fi
          git diff --cached --stat

      - uses: actions/upload-artifact@v4
        with:
          name: factory-patch
          path: ${{ runner.temp }}/factory.patch
          if-no-files-found: error

  publish:
    name: publish
    needs: [contract, implement]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.contract.outputs.base_sha }}

      - uses: actions/download-artifact@v4
        with:
          name: factory-patch
          path: ${{ runner.temp }}/patch

      - uses: actions/download-artifact@v4
        with:
          name: factory-contract
          path: ${{ runner.temp }}/contract

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply patch, guard paths, open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
          HASH: ${{ inputs.contract_hash }}
          ATTEMPT: ${{ inputs.attempt_id }}
          BASE_SHA: ${{ needs.contract.outputs.base_sha }}
        run: |
          set -euo pipefail
          # Trusted guard comes from the base checkout before the patch is applied.
          cp .github/factory/contract.mjs "$RUNNER_TEMP/contract.mjs"
          branch="factory/issue-$ISSUE"
          git checkout -b "$branch"
          git apply --index "$RUNNER_TEMP/patch/factory.patch"
          mkdir -p .factory
          cp "$RUNNER_TEMP/contract/contract.json" .factory/contract.json
          git add .factory/contract.json
          [ "$(node "$RUNNER_TEMP/contract.mjs" hash .factory/contract.json)" = "$HASH" ] || { echo "::error::contract hash drifted"; exit 1; }

          risk=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(".factory/contract.json","utf8")).riskClass)')
          {
            echo "Implements execution contract #$ISSUE (risk class: $risk)."
            echo
            echo "Generated by the factory-build workflow (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from base \`$BASE_SHA\`."
            echo "Draft until an independent factory-review verdict names this exact head and a human merges."
            echo
            echo "Factory-Contract-Hash: $HASH"
            echo "Factory-Attempt: $ATTEMPT"
          } > "$RUNNER_TEMP/pr-body.md"

          git diff --cached --no-renames --name-only "$BASE_SHA" > "$RUNNER_TEMP/changed.txt"
          node "$RUNNER_TEMP/contract.mjs" guard .factory/contract.json "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/pr-body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "factory: implement #$ISSUE" -m "$(printf 'Factory-Contract-Hash: %s\nFactory-Attempt: %s' "$HASH" "$ATTEMPT")"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "factory: implement #$ISSUE" --body-file "$RUNNER_TEMP/pr-body.md"
