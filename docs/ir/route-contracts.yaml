shells:
  operator: AppShell
  customer: CustomerPortalShell
routes:
- path: /overview
  screen: overview
  module: overview
  shell: operator
- path: /leads
  screen: lead-list
  module: sales
  shell: operator
- path: /leads/:leadId
  screen: lead-detail
  module: sales
  shell: operator
- path: /estimates/new
  screen: estimate-editor
  module: estimating
  shell: operator
- path: /estimates/:estimateId
  screen: estimate-detail
  module: estimating
  shell: operator
- path: /jobs
  screen: job-list
  module: jobs
  shell: operator
- path: /jobs/:jobId
  screen: job-detail
  module: jobs
  shell: operator
- path: /schedule
  screen: schedule
  module: scheduling
  shell: operator
- path: /field/today
  screen: field-today
  module: field
  shell: operator
- path: /invoices/:invoiceId
  screen: invoice-detail
  module: finance
  shell: operator
- path: /customers/:customerId/portal
  screen: customer-portal
  module: customers
  shell: customer
- path: /settings/integrations
  screen: integrations
  module: integrations
  shell: operator
- path: /settings/billing
  screen: billing
  module: finance
  shell: operator
- path: /automation/knowledge
  screen: knowledge
  module: automation_knowledge
  shell: operator
- path: /commercial/bids
  screen: bid-tracker
  module: commercial_procurement
  shell: operator
